<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理 - Shop</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="orders">
    <div id="navbar"></div>

    <div class="container">
        <div class="admin-header">
            <h2>订单管理</h2>
        </div>
        <div class="admin-table">
            <table>
                <thead>
                    <tr>
                        <th>订单号</th>
                        <th>用户</th>
                        <th>商品</th>
                        <th>金额</th>
                        <th>状态</th>
                        <th>时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="ordersTable"></tbody>
            </table>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        const user = requireAuth();
        if (user && user.role !== 'ADMIN') {
            window.location.href = '../index.html';
        }

        const statusMap = {
            'PENDING': '待支付',
            'PAID': '已支付',
            'SHIPPED': '已发货',
            'COMPLETED': '已完成',
            'CANCELLED': '已取消'
        };

        const nextStatus = {
            'PENDING': 'PAID',
            'PAID': 'SHIPPED',
            'SHIPPED': 'COMPLETED'
        };

        const nextStatusLabel = {
            'PENDING': '确认支付',
            'PAID': '确认发货',
            'SHIPPED': '确认完成'
        };

        async function init() {
            await loadOrders();
        }

        async function loadOrders() {
            try {
                const orders = await api.get('/orders/admin/all');
                const tbody = document.getElementById('ordersTable');
                tbody.innerHTML = orders.map(order => `
                    <tr>
                        <td>${order.orderNo}</td>
                        <td>${order.user ? order.user.username : '-'}</td>
                        <td>${order.items.map(i => i.productName + 'x' + i.quantity).join(', ')}</td>
                        <td>${formatPrice(order.totalAmount)}</td>
                        <td><span class="order-status ${order.status}">${statusMap[order.status] || order.status}</span></td>
                        <td>${new Date(order.createdAt).toLocaleString('zh-CN')}</td>
                        <td class="actions">
                            ${nextStatus[order.status] ? `<button class="btn btn-primary btn-sm" onclick="updateStatus(${order.id}, '${nextStatus[order.status]}')">${nextStatusLabel[order.status]}</button>` : ''}
                            ${order.status === 'PENDING' ? `<button class="btn btn-danger btn-sm" onclick="updateStatus(${order.id}, 'CANCELLED')">取消</button>` : ''}
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                showToast('加载订单失败', 'error');
            }
        }

        async function updateStatus(orderId, status) {
            try {
                await api.put('/orders/' + orderId + '/status', { status });
                showToast('状态更新成功');
                await loadOrders();
            } catch (e) {
                showToast('更新失败', 'error');
            }
        }

        init();
    </script>
</body>
</html>
