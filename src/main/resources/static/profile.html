<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 优选商城</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <span class="logo-icon">优</span>
                <span class="logo-text">优选</span>
            </a>
            <div class="header-right">
                <a href="index.html" class="cart-link">首页</a>
                <a href="javascript:void(0)" id="cartLink" class="cart-link" onclick="goCart()">购物车 (<span id="cartBadge">0</span>)</a>
                <div id="userArea">
                    <button class="btn btn-outline" onclick="showModal('loginModal')">登录</button>
                </div>
            </div>
        </div>
    </header>

    <main class="main container">
        <div class="profile-container">
            <!-- 左侧菜单 -->
            <aside class="profile-sidebar">
                <div class="profile-avatar" onclick="document.getElementById('avatarInput').click()" title="点击更换头像">
                    <img id="sidebarAvatar" src="" alt="头像" onerror="this.style.display='none';this.parentElement.querySelector('.avatar-placeholder').style.display='flex'">
                    <span class="avatar-placeholder">&#128100;</span>
                </div>
                <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar()">
                <div class="profile-name" id="profileName">用户</div>
                <ul class="profile-menu" id="profileMenu"></ul>
            </aside>

            <!-- 右侧内容 -->
            <div class="profile-content" id="profileContent"></div>
        </div>
    </main>

    <!-- 地址弹窗 -->
    <div class="modal" id="addressModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="addressModalTitle">添加地址</h3>
                <button class="btn-text" onclick="closeModal('addressModal')">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="addrId">
                <div class="form-group"><label>收货人</label><input type="text" id="addrName" placeholder="请输入收货人姓名"></div>
                <div class="form-group"><label>手机号</label><input type="text" id="addrPhone" placeholder="请输入手机号"></div>
                <div class="form-group"><label>省份</label><input type="text" id="addrProvince" placeholder="请输入省份"></div>
                <div class="form-group"><label>城市</label><input type="text" id="addrCity" placeholder="请输入城市"></div>
                <div class="form-group"><label>区/县</label><input type="text" id="addrDistrict" placeholder="请输入区/县"></div>
                <div class="form-group"><label>详细地址</label><input type="text" id="addrDetail" placeholder="请输入详细地址"></div>
                <div class="form-group">
                    <label><input type="checkbox" id="addrIsDefault"> 设为默认地址</label>
                </div>
                <button class="btn btn-primary btn-block" onclick="saveAddress()">保存</button>
            </div>
        </div>
    </div>

    <!-- 商品编辑弹窗（管理员用） -->
    <div class="modal" id="productModal">
        <div class="modal-content" style="width:650px;max-height:80vh">
            <div class="modal-header">
                <h3 id="productModalTitle">添加商品</h3>
                <button class="btn-text" onclick="closeModal('productModal')">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editProductId">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 20px">
                    <div class="form-group"><label>商品名称</label><input type="text" id="editProductName" placeholder="请输入商品名称"></div>
                    <div class="form-group"><label>分类ID</label><input type="number" id="editProductCategoryId" placeholder="请输入分类ID"></div>
                </div>
                <div class="form-group"><label>描述</label><input type="text" id="editProductDesc" placeholder="请输入商品描述"></div>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px">
                    <div class="form-group"><label>价格</label><input type="number" id="editProductPrice" step="0.01" placeholder="售价"></div>
                    <div class="form-group"><label>原价</label><input type="number" id="editProductOrigPrice" step="0.01" placeholder="原价"></div>
                    <div class="form-group"><label>库存</label><input type="number" id="editProductStock" placeholder="库存"></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 20px">
                    <div class="form-group">
                        <label>商品图片</label>
                        <input type="file" id="editProductImageFile" accept="image/*" onchange="previewProductImage()" style="display:block;margin-bottom:8px">
                        <img id="editProductImagePreview" style="max-width:200px;max-height:200px;display:none;border-radius:6px;border:1px solid var(--border);margin-top:8px">
                        <input type="hidden" id="editProductImage" value="">
                    </div>
                    <div class="form-group">
                        <label>&nbsp;</label>
                        <div style="padding-top:10px">
                            <label style="display:inline-flex;align-items:center;gap:8px;font-weight:400;cursor:pointer">
                                <input type="checkbox" id="editProductIsOnSale" checked style="width:auto;margin:0"> 上架
                            </label>
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary btn-block" onclick="saveProduct()">保存</button>
            </div>
        </div>
    </div>

    <!-- 登录弹窗 -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>登录</h3>
                <button class="btn-text" onclick="closeModal('loginModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group"><label>用户名/手机号</label><input type="text" id="loginUsername" placeholder="请输入用户名或手机号"></div>
                <div class="form-group"><label>密码</label><input type="password" id="loginPassword" placeholder="请输入密码"></div>
                <div class="form-group">
                    <label>验证码</label>
                    <div style="display:flex;align-items:center;gap:10px">
                        <span id="loginCaptchaQuestion" style="font-weight:bold;font-size:20px;font-family:'Courier New',monospace;min-width:80px;background:linear-gradient(135deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);padding:6px 14px;border-radius:4px;text-align:center;letter-spacing:4px;color:#333;user-select:none;border:1px dashed #ccc">加载中...</span>
                        <input type="text" id="loginCaptchaAnswer" placeholder="请输入答案" style="flex:1">
                        <input type="hidden" id="loginCaptchaToken">
                        <a href="javascript:void(0)" onclick="loadCaptcha('login')" style="font-size:12px;white-space:nowrap">换一个</a>
                    </div>
                </div>
                <button class="btn btn-primary btn-block" onclick="login()">登录</button>
                <p class="text-center" style="margin-top:12px">没有账号？<a href="#" onclick="showModal('registerModal');closeModal('loginModal')">立即注册</a></p>
            </div>
        </div>
    </div>

    <div class="modal" id="registerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>注册</h3>
                <button class="btn-text" onclick="closeModal('registerModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group"><label>用户名</label><input type="text" id="regUsername" placeholder="请输入用户名"></div>
                <div class="form-group"><label>密码</label><input type="password" id="regPassword" placeholder="请输入密码"></div>
                <div class="form-group"><label>手机号</label><input type="text" id="regPhone" placeholder="请输入手机号" maxlength="11"></div>
                <div class="form-group">
                    <label>身份</label>
                    <label style="display:inline-flex;align-items:center;gap:6px;font-weight:400;cursor:pointer">
                        <input type="checkbox" id="regIsAdmin" style="width:auto;margin:0"> 注册为管理员
                    </label>
                </div>
                <div class="form-group">
                    <label>短信验证码</label>
                    <div style="display:flex;align-items:center;gap:10px">
                        <input type="text" id="regSMSCode" placeholder="请输入验证码" style="flex:1" maxlength="6">
                        <button id="sendSMSBtn" class="btn btn-outline" onclick="sendSMS()" style="white-space:nowrap;font-size:13px">发送验证码</button>
                    </div>
                    <div id="smsDebugCode" style="margin-top:6px;padding:8px 12px;background:#e8f5e9;border-radius:4px;color:#2e7d32;font-size:14px;display:none"></div>
                </div>
                <button class="btn btn-primary btn-block" onclick="register()">注册</button>
                <p class="text-center" style="margin-top:12px">已有账号？<a href="#" onclick="showModal('loginModal');closeModal('registerModal')">去登录</a></p>
            </div>
        </div>
    </div>

    <script src="js/common.js?v=9"></script>
    <script src="js/profile.js?v=5"></script>
</body>
</html>
