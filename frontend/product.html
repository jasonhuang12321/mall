<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品详情 - 优选商城</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">优选商城</a>
            <div class="header-right">
                <a href="index.html" class="cart-link">首页</a>
                <a href="javascript:void(0)" id="cartLink" class="cart-link" onclick="goCart()">购物车 (<span id="cartBadge">0</span>)</a>
                <div id="userArea">
                    <button class="btn btn-outline" onclick="showModal('loginModal')">登录</button>
                </div>
            </div>
        </div>
    </header>

    <main class="main container">
        <!-- 面包屑 -->
        <div class="breadcrumb" style="margin-bottom:16px;font-size:13px;color:var(--text-light)">
            <a href="index.html">首页</a> &gt; <span id="breadcrumbCategory">商品详情</span>
        </div>

        <!-- 商品详情 -->
        <div class="product-detail" id="productDetail">
            <div class="product-gallery">
                <img class="product-main-img" id="detailImage" src="" alt="">
            </div>
            <div class="product-info-right">
                <h1 class="detail-name" id="detailName"></h1>
                <div class="detail-price">
                    <span class="price-current" id="detailPrice"></span>
                    <span class="price-original" id="detailOriginalPrice" style="margin-left:12px"></span>
                </div>
                <div class="detail-meta">
                    <span>库存: <strong id="detailStock"></strong></span>
                    <span>已售: <strong id="detailSales"></strong></span>
                    <span>分类: <strong id="detailCategory"></strong></span>
                </div>
                <div class="detail-desc" id="detailDesc"></div>
                <div class="detail-actions">
                    <button class="btn btn-primary btn-large" onclick="addToCart()">加入购物车</button>
                    <button class="btn btn-outline btn-large" onclick="buyNow()">立即购买</button>
                </div>
            </div>
        </div>

        <!-- 评论区域 -->
        <div class="comment-section" id="commentSection">
            <h3 class="comment-title">商品评论 (<span id="commentCount">0</span>)</h3>
            <div class="comment-form" id="commentForm">
                <textarea id="commentContent" rows="3" placeholder="写下你的评论..."></textarea>
                <div class="comment-form-footer">
                    <div class="rating-stars" id="ratingStars">
                        <span class="star" data-r="1">&#9733;</span>
                        <span class="star" data-r="2">&#9733;</span>
                        <span class="star" data-r="3">&#9733;</span>
                        <span class="star" data-r="4">&#9733;</span>
                        <span class="star" data-r="5">&#9733;</span>
                    </div>
                    <button class="btn btn-primary btn-sm" onclick="submitComment()">发表评论</button>
                </div>
            </div>
            <div id="commentList"></div>
        </div>
    </main>

    <!-- 登录弹窗 -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>登录</h3>
                <button class="btn-text" onclick="closeModal('loginModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group"><label>用户名/手机号</label><input type="text" id="loginUsername" placeholder="请输入用户名或手机号"></div>
                <div class="form-group"><label>密码</label><input type="password" id="loginPassword" placeholder="请输入密码"></div>
                <div class="form-group">
                    <label>验证码</label>
                    <div style="display:flex;align-items:center;gap:10px">
                        <span id="loginCaptchaQuestion" style="font-weight:bold;font-size:20px;font-family:'Courier New',monospace;min-width:80px;background:linear-gradient(135deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);padding:6px 14px;border-radius:4px;text-align:center;letter-spacing:4px;color:#333;user-select:none;border:1px dashed #ccc">加载中...</span>
                        <input type="text" id="loginCaptchaAnswer" placeholder="请输入答案" style="flex:1">
                        <input type="hidden" id="loginCaptchaToken">
                        <a href="javascript:void(0)" onclick="loadCaptcha('login')" style="font-size:12px;white-space:nowrap">换一个</a>
                    </div>
                </div>
                <button class="btn btn-primary btn-block" onclick="login()">登录</button>
                <p class="text-center" style="margin-top:12px">没有账号？<a href="#" onclick="showModal('registerModal');closeModal('loginModal')">立即注册</a></p>
            </div>
        </div>
    </div>

    <div class="modal" id="registerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>注册</h3>
                <button class="btn-text" onclick="closeModal('registerModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group"><label>用户名</label><input type="text" id="regUsername" placeholder="请输入用户名"></div>
                <div class="form-group"><label>昵称</label><input type="text" id="regNickname" placeholder="请输入昵称"></div>
                <div class="form-group"><label>密码</label><input type="password" id="regPassword" placeholder="请输入密码"></div>
                <div class="form-group"><label>手机号</label><input type="text" id="regPhone" placeholder="请输入手机号" maxlength="11"></div>
                <div class="form-group">
                    <label>短信验证码</label>
                    <div style="display:flex;align-items:center;gap:10px">
                        <input type="text" id="regSMSCode" placeholder="请输入验证码" style="flex:1" maxlength="6">
                        <button id="sendSMSBtn" class="btn btn-outline" onclick="sendSMS()" style="white-space:nowrap;font-size:13px">发送验证码</button>
                    </div>
                    <div id="smsDebugCode" style="margin-top:6px;padding:8px 12px;background:#e8f5e9;border-radius:4px;color:#2e7d32;font-size:14px;display:none"></div>
                </div>
                <button class="btn btn-primary btn-block" onclick="register()">注册</button>
                <p class="text-center" style="margin-top:12px">已有账号？<a href="#" onclick="showModal('loginModal');closeModal('registerModal')">去登录</a></p>
            </div>
        </div>
    </div>

    <script src="js/common.js?v=7"></script>
    <script src="js/product.js?v=2"></script>
</body>
</html>
