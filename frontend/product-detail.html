<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品详情 - Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="detail">
    <div id="navbar"></div>

    <div class="container" id="productDetail"></div>

    <script src="js/api.js"></script>
    <script>
        async function init() {
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');
            if (!productId) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const product = await api.get('/products/' + productId);
                renderProduct(product);
            } catch (e) {
                showToast('商品不存在', 'error');
                setTimeout(() => window.location.href = 'index.html', 1500);
            }
        }

        function renderProduct(product) {
            const container = document.getElementById('productDetail');
            container.innerHTML = `
                <div class="product-detail">
                    <img src="${product.imageUrl || 'https://picsum.photos/seed/' + product.id + '/400/400'}" alt="${product.name}">
                    <div class="detail-info">
                        <div class="detail-name">${product.name}</div>
                        <div class="detail-price">${product.price}</div>
                        <div class="detail-desc">${product.description || '暂无描述'}</div>
                        <div class="detail-stock">库存：${product.stock} 件</div>
                        <div class="detail-actions">
                            <input type="number" id="quantity" value="1" min="1" max="${product.stock}">
                            <button class="btn btn-primary" onclick="addToCart(${product.id})">加入购物车</button>
                            <button class="btn btn-primary" onclick="buyNow(${product.id})">立即购买</button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function addToCart(productId) {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const quantity = parseInt(document.getElementById('quantity').value);
            try {
                await api.post('/cart', { productId, quantity });
                showToast('已加入购物车');
                loadCartCount();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        async function buyNow(productId) {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const quantity = parseInt(document.getElementById('quantity').value);
            try {
                await api.post('/orders', {
                    items: [{ productId, quantity }]
                });
                showToast('下单成功');
                setTimeout(() => window.location.href = 'orders.html', 500);
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        init();
    </script>
</body>
</html>
