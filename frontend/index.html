<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
    <div id="navbar"></div>

    <div class="container" id="userView">
        <!-- 搜索栏 -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索商品...">
            <button onclick="searchProducts()">搜索</button>
        </div>

        <!-- 分类导航 -->
        <div class="category-nav" id="categoryNav">
            <div class="cat-item active" data-id="" onclick="filterByCategory(null, this)">全部</div>
        </div>

        <!-- 商品列表 -->
        <div class="product-grid" id="productGrid"></div>
        <div class="page-info" id="pageInfo"></div>
    </div>

    <!-- 管理员视图 -->
    <div class="container" id="adminView" style="display:none">
        <div class="admin-header">
            <h2>商品管理</h2>
            <button class="btn btn-primary" onclick="showAddModal()">添加商品</button>
        </div>
        <div class="admin-table">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>图片</th>
                        <th>名称</th>
                        <th>价格</th>
                        <th>库存</th>
                        <th>分类</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="adminProductTable"></tbody>
            </table>
        </div>
    </div>

    <!-- 商品编辑模态框 -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <h3 id="modalTitle">添加商品</h3>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label>商品名称</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="productDesc"></textarea>
                </div>
                <div class="form-group">
                    <label>价格</label>
                    <input type="number" id="productPrice" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>库存</label>
                    <input type="number" id="productStock" required>
                </div>
                <div class="form-group">
                    <label>图片URL</label>
                    <input type="text" id="productImage">
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <select id="productCategory"></select>
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select id="productStatus">
                        <option value="ON">上架</option>
                        <option value="OFF">下架</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        let currentProducts = [];
        let currentCategoryId = null;

        // 页面加载
        async function init() {
            const user = getCurrentUser();
            if (user && user.role === 'ADMIN') {
                document.getElementById('userView').style.display = 'none';
                document.getElementById('adminView').style.display = 'block';
                await Promise.all([loadAdminProducts(), loadCategoriesForForm()]);
            } else {
                document.getElementById('userView').style.display = 'block';
                document.getElementById('adminView').style.display = 'none';
                await Promise.all([loadCategories(), loadProducts()]);
            }
        }

        // 加载分类导航
        async function loadCategories() {
            try {
                const categories = await api.get('/categories');
                const nav = document.getElementById('categoryNav');
                categories.forEach(cat => {
                    const div = document.createElement('div');
                    div.className = 'cat-item';
                    div.setAttribute('data-id', cat.id);
                    div.textContent = cat.name;
                    div.onclick = () => filterByCategory(cat.id, div);
                    nav.appendChild(div);
                });
            } catch (e) {
                console.error('加载分类失败', e);
            }
        }

        // 加载商品
        async function loadProducts(categoryId, keyword) {
            try {
                let url = '/products';
                const params = [];
                if (categoryId) params.push('categoryId=' + categoryId);
                if (keyword) params.push('keyword=' + encodeURIComponent(keyword));
                if (params.length) url += '?' + params.join('&');

                currentProducts = await api.get(url);
                renderProducts();
            } catch (e) {
                console.error('加载商品失败', e);
            }
        }

        // 渲染商品列表
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            if (currentProducts.length === 0) {
                grid.innerHTML = '<div class="cart-empty">暂无商品</div>';
                document.getElementById('pageInfo').textContent = '';
                return;
            }

            grid.innerHTML = currentProducts.map(p => `
                <div class="product-card" onclick="location.href='product-detail.html?id=${p.id}'">
                    <img src="${p.imageUrl || 'https://picsum.photos/seed/' + p.id + '/400/400'}" alt="${p.name}">
                    <div class="info">
                        <div class="name">${p.name}</div>
                        <div class="price">${p.price}</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('pageInfo').textContent = `共 ${currentProducts.length} 件商品`;
        }

        // 按分类筛选
        function filterByCategory(categoryId, el) {
            currentCategoryId = categoryId;
            document.querySelectorAll('#categoryNav .cat-item').forEach(item => item.classList.remove('active'));
            if (el) el.classList.add('active');
            document.getElementById('searchInput').value = '';
            loadProducts(categoryId, null);
        }

        // 搜索
        function searchProducts() {
            const keyword = document.getElementById('searchInput').value.trim();
            document.querySelectorAll('#categoryNav .cat-item').forEach(item => item.classList.remove('active'));
            document.querySelector('#categoryNav .cat-item[data-id=""]').classList.add('active');
            currentCategoryId = null;
            loadProducts(null, keyword);
        }

        // ========== 管理员功能 ==========

        async function loadAdminProducts() {
            try {
                const products = await api.get('/products/admin/all');
                const tbody = document.getElementById('adminProductTable');
                tbody.innerHTML = products.map(p => `
                    <tr>
                        <td>${p.id}</td>
                        <td><img src="${p.imageUrl || 'https://picsum.photos/seed/' + p.id + '/60/60'}" width="60" height="60" style="object-fit:cover;border-radius:4px"></td>
                        <td>${p.name}</td>
                        <td>${formatPrice(p.price)}</td>
                        <td>${p.stock}</td>
                        <td>${p.category ? p.category.name : '-'}</td>
                        <td>${p.status === 'ON' ? '上架' : '下架'}</td>
                        <td class="actions">
                            <button class="btn btn-secondary btn-sm" onclick="editProduct(${p.id})">编辑</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">删除</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                showToast('加载商品失败', 'error');
            }
        }

        async function loadCategoriesForForm() {
            try {
                const categories = await api.get('/categories');
                const select = document.getElementById('productCategory');
                select.innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } catch (e) {}
        }

        function showAddModal() {
            document.getElementById('modalTitle').textContent = '添加商品';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('productModal').classList.add('show');
        }

        async function editProduct(id) {
            try {
                const product = await api.get('/products/' + id);
                document.getElementById('modalTitle').textContent = '编辑商品';
                document.getElementById('productId').value = product.id;
                document.getElementById('productName').value = product.name;
                document.getElementById('productDesc').value = product.description || '';
                document.getElementById('productPrice').value = product.price;
                document.getElementById('productStock').value = product.stock;
                document.getElementById('productImage').value = product.imageUrl || '';
                document.getElementById('productStatus').value = product.status;
                if (product.category) {
                    document.getElementById('productCategory').value = product.category.id;
                }
                document.getElementById('productModal').classList.add('show');
            } catch (e) {
                showToast('获取商品信息失败', 'error');
            }
        }

        async function deleteProduct(id) {
            if (!confirm('确定要删除该商品吗？')) return;
            try {
                await api.delete('/products/' + id);
                showToast('删除成功');
                await loadAdminProducts();
            } catch (e) {
                showToast('删除失败', 'error');
            }
        }

        function closeModal() {
            document.getElementById('productModal').classList.remove('show');
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const body = {
                name: document.getElementById('productName').value,
                description: document.getElementById('productDesc').value,
                price: parseFloat(document.getElementById('productPrice').value),
                stock: parseInt(document.getElementById('productStock').value),
                imageUrl: document.getElementById('productImage').value,
                status: document.getElementById('productStatus').value,
                category: { id: parseInt(document.getElementById('productCategory').value) }
            };

            try {
                if (id) {
                    await api.put('/products/' + id, body);
                    showToast('更新成功');
                } else {
                    await api.post('/products', body);
                    showToast('添加成功');
                }
                closeModal();
                await loadAdminProducts();
            } catch (e) {
                showToast(e.message, 'error');
            }
        });

        // 点击模态框背景关闭
        document.getElementById('productModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('productModal')) {
                closeModal();
            }
        });

        init();
    </script>
</body>
</html>
