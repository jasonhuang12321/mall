<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="orders">
    <div id="navbar"></div>

    <div class="container">
        <h2 style="margin-bottom:24px">我的订单</h2>
        <div id="ordersContent"></div>
    </div>

    <script src="js/api.js"></script>
    <script>
        requireAuth();

        const statusMap = {
            'PENDING': '待支付',
            'PAID': '已支付',
            'SHIPPED': '已发货',
            'COMPLETED': '已完成',
            'CANCELLED': '已取消'
        };

        async function init() {
            await loadOrders();
        }

        async function loadOrders() {
            try {
                const orders = await api.get('/orders');
                renderOrders(orders);
            } catch (e) {
                showToast('加载订单失败', 'error');
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('ordersContent');
            if (orders.length === 0) {
                container.innerHTML = '<div class="cart-empty">暂无订单</div>';
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-no">订单号：${order.orderNo}</span>
                        <span class="order-status ${order.status}">${statusMap[order.status] || order.status}</span>
                        <span style="color:#999;font-size:13px">${new Date(order.createdAt).toLocaleString('zh-CN')}</span>
                    </div>
                    <div class="order-items">
                        ${order.items.map(item => `
                            <div class="order-item">
                                <span>${item.productName} x ${item.quantity}</span>
                                <span>${formatPrice(item.productPrice * item.quantity)}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="order-total">合计：${formatPrice(order.totalAmount)}</div>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
